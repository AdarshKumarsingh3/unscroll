name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.11
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Locate Android Project & Build APK
      run: |
        if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
          PROJECT_DIR="."
        elif [ -d "android apk" ]; then
          PROJECT_DIR="android apk"
        elif [ -d "android-app" ]; then
          PROJECT_DIR="android-app"
        else
          PROJECT_DIR="."
        fi

        echo "Found Android project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: unscroll-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
