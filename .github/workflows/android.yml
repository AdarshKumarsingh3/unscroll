name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.11
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Locate Android Project & Build APK
      run: |
        # Automatically find the directory containing settings.gradle or settings.gradle.kts
        PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)

        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi

        if [ -z "$PROJECT_DIR" ]; then
          echo "ERROR: Neither settings.gradle nor build.gradle was found in this repo."
          echo "Files in repository are:"
          find . -maxdepth 3 -not -path '*/.*'
          exit 1
        fi

        echo "Found Android project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: unscroll-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
